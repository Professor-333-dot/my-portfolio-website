<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POKO FLIX — Stream. Enjoy. Repeat.</title>
  <style>
    :root {
      --bg-black: #060608;
      --bg-panel: #0d0d12;
      --bg-card: #14141c;
      --crimson: #e5192b;
      --crimson-bright: #ff2a3d;
      --crimson-glow: rgba(229, 25, 43, 0.55);
      --text-main: #f5f5f7;
      --text-muted: #9a9aa6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --sidebar-w: 215px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      background: var(--bg-black);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ==================== POWERFUL CINEMATIC INTRO ==================== */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #220409 0%, #050507 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.75s ease, visibility 0.75s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-ring {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 2px solid rgba(255, 42, 61, 0.3);
      box-shadow: 0 0 90px rgba(229, 25, 43, 0.4), inset 0 0 60px rgba(229, 25, 43, 0.25);
      animation: pulseRing 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .intro-streak {
      position: absolute;
      width: 140%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff2a3d, #ffffff, #ff2a3d, transparent);
      filter: drop-shadow(0 0 14px #ff2a3d);
      transform: rotate(-16deg) scaleX(0);
      animation: streakSlash 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    .intro-logo {
      position: relative;
      z-index: 2;
      font-size: clamp(3.2rem, 8vw, 6.2rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 10%, #ff3b4d 50%, #990814 95%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(255, 36, 56, 0.75));
      opacity: 0;
      transform: scale(0.72);
      animation: logoZoom 1.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .intro-tagline {
      margin-top: 10px;
      font-size: 0.95rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      opacity: 0;
      animation: fadeUp 0.9s ease 1s forwards;
    }

    .skip-intro-btn {
      position: fixed;
      bottom: 28px;
      right: 32px;
      z-index: 10000;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.4); opacity: 0; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    @keyframes streakSlash {
      0% { transform: rotate(-16deg) scaleX(0); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: rotate(-16deg) scaleX(1); opacity: 0.9; }
    }

    @keyframes logoZoom {
      0% { opacity: 0; transform: scale(0.72); }
      65% { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== MAIN APP SHELL ==================== */
    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: linear-gradient(180deg, #0b0b0f 0%, #07070a 100%);
      border-right: 1px solid var(--border-subtle);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: radial-gradient(circle at 30% 30%, #ff4d5e, #8f0815);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.15rem;
      box-shadow: 0 0 18px var(--crimson-glow);
    }

    .brand-text {
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 0.95rem;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.92rem;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(229, 25, 43, 0.32), rgba(229, 25, 43, 0.08));
      border-left: 3px solid var(--crimson-bright);
    }

    .main-area {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.78), transparent);
    }

    .search-box {
      width: min(380px, 46vw);
      background: rgba(16, 16, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 9px 18px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    .admin-pill {
      background: rgba(229, 25, 43, 0.22);
      border: 1px solid rgba(255, 42, 61, 0.5);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Hero Stage */
    .hero {
      position: relative;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 90px 24px 46px;
      background:
        radial-gradient(circle at 50% 45%, rgba(229, 25, 43, 0.4), transparent 45%),
        radial-gradient(circle at 25% 75%, rgba(120, 35, 190, 0.34), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(20, 110, 220, 0.3), transparent 50%),
        linear-gradient(180deg, rgba(6, 6, 8, 0.25) 0%, rgba(6, 6, 8, 0.96) 100%);
      overflow: hidden;
    }

    .hero-emblem {
      font-size: clamp(4.5rem, 11vw, 8.5rem);
      font-weight: 900;
      line-height: 0.95;
      background: linear-gradient(180deg, #ff7a85 0%, #e5192b 55%, #66040d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 36px rgba(229, 25, 43, 0.65));
    }

    .hero-title {
      font-size: clamp(2rem, 4.5vw, 3.3rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      margin-top: -10px;
      text-shadow: 0 6px 28px rgba(0, 0, 0, 0.8);
    }

    .hero-sub {
      color: #d6d6e0;
      margin-top: 8px;
      font-size: 1.05rem;
    }

    .hero-ctas {
      margin-top: 22px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff2a3d, #b80d1d);
      border: none;
      color: #fff;
      padding: 12px 26px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--crimson-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Admin Vault Drawer */
    .admin-vault {
      position: fixed;
      top: 72px;
      right: 28px;
      z-index: 30;
      width: 260px;
      background: rgba(15, 15, 22, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8);
    }

    .admin-vault.collapsed {
      display: none;
    }

    .admin-vault h4 {
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-vault input {
      width: 100%;
      background: #09090e;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 9px 11px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .admin-vault button.unlock-btn {
      width: 100%;
      background: var(--crimson);
      border: none;
      color: #fff;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Trending Now Section */
    .section {
      padding: 10px 28px 54px;
      position: relative;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-header h2 {
      font-size: 1.15rem;
    }

    .carousel-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .carousel {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(195px, 1fr);
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      width: 100%;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .card {
      height: 135px;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 28px rgba(229, 25, 43, 0.38);
    }

    .card-badge {
      align-self: flex-start;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 10, 15, 0.88);
      color: #fff;
      cursor: pointer;
    }

    .arrow-btn.left { left: -12px; }
    .arrow-btn.right { right: -12px; }

    /* ==================== WORKING VIDEO PLAYER MODAL ==================== */
    .player-modal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-modal.open {
      display: flex;
    }

    .player-box {
      width: min(960px, 96vw);
      background: #0d0d14;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9);
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }

    .player-header h3 {
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .close-player-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }

    .video-wrap {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    #pokoVideo,
    #cinemaStageCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #pokoVideo {
      z-index: 2;
      background: #000;
    }

    #pokoVideo.hidden {
      display: none;
    }

    #cinemaStageCanvas {
      z-index: 1;
    }

    .cinema-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      padding: 12px 16px;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.92));
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cinema-controls.hidden {
      display: none;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .seek-bar {
      flex: 1;
      accent-color: var(--crimson-bright);
      cursor: pointer;
    }

    .time-readout {
      font-family: monospace;
      font-size: 0.82rem;
      color: #e4e4ee;
    }

    .player-footer {
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #0a0a10;
    }

    .stream-url-form {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 240px;
    }

    .stream-url-form input[type="url"] {
      flex: 1;
      background: #14141f;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .stream-url-form button,
    .cinema-mode-btn,
    .file-pick-label {
      background: var(--crimson);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .cinema-mode-btn,
    .file-pick-label {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .player-status {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .fullscreen-hint {
      position: fixed;
      right: 24px;
      bottom: 18px;
      background: rgba(15, 15, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 15;
    }

    .fullscreen-hint kbd {
      background: #232330;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 0 3px;
    }
  </style>
</head>
<body>

  <!-- POWERFUL INTRO OVERLAY -->
  <div id="intro-overlay" role="dialog" aria-label="POKO FLIX Intro">
    <div class="intro-ring"></div>
    <div class="intro-streak"></div>
    <div class="intro-logo">POKO FLIX</div>
    <div class="intro-tagline">Stream • Enjoy • Repeat</div>
    <button class="skip-intro-btn" id="skipIntroBtn">Skip Intro</button>
  </div>

  <!-- MAIN SHELL -->
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">PF</div>
        <div class="brand-text">POKO FLIX</div>
      </div>
      <ul class="nav-list" id="sidebarNav">
        <li class="nav-item active" data-filter="all">🏠 Home</li>
        <li class="nav-item" data-filter="movie">🎬 Movies</li>
        <li class="nav-item" data-filter="series">📺 Series</li>
        <li class="nav-item" data-filter="mylist">＋ My List</li>
        <li class="nav-item" id="sidebarAdminBtn">👑 Admin Panel</li>
      </ul>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <input class="search-box" id="searchInput" type="search" placeholder="🔍 Search movies, series..." />
        <div class="topbar-actions">
          <button class="icon-btn" id="replayIntroBtn" title="Replay Intro">🔊</button>
          <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
          <button class="admin-pill" id="topAdminBtn">👑 Admin Login</button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-emblem">P</div>
        <h1 class="hero-title">POKO FLIX</h1>
        <p class="hero-sub">Stream. Enjoy. Repeat.</p>
        <div class="hero-ctas">
          <button class="btn-primary" id="playNowBtn">▶ Play Now</button>
          <button class="btn-secondary" id="heroMyListBtn">＋ My List</button>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 id="sectionHeading">Trending Now &gt;</h2>
        </div>
        <div class="carousel-wrap">
          <button class="arrow-btn left" id="scrollLeft">&lt;</button>
          <div class="carousel" id="trendingCarousel"></div>
          <button class="arrow-btn right" id="scrollRight">&gt;</button>
        </div>
      </section>
    </div>
  </div>

  <!-- VIDEO PLAYER MODAL -->
  <div class="player-modal" id="playerModal" aria-hidden="true">
    <div class="player-box">
      <div class="player-header">
        <h3 id="playerTitle">Now Playing — POKO FLIX</h3>
        <button class="close-player-btn" id="closePlayerBtn" title="Close (Esc)">✕</button>
      </div>
      <div class="video-wrap" id="videoWrap">
        <canvas id="cinemaStageCanvas" width="1280" height="720"></canvas>
        <video id="pokoVideo" class="hidden" controls playsinline></video>
        <div class="cinema-controls" id="cinemaControls">
          <button type="button" class="ctrl-btn" id="cinemaPlayPauseBtn">⏸ Pause</button>
          <input type="range" class="seek-bar" id="cinemaSeekBar" min="0" max="120" value="0" step="0.5" />
          <span class="time-readout" id="cinemaTimeReadout">00:00 / 02:00</span>
          <button type="button" class="ctrl-btn" id="cinemaFullscreenBtn">⛶</button>
        </div>
      </div>
      <div class="player-footer">
        <form class="stream-url-form" id="customUrlForm">
          <input type="url" id="customUrlInput" placeholder="Paste .mp4 / .webm URL..." />
          <button type="submit">Load URL</button>
        </form>
        <label class="file-pick-label">
          📁 Choose Video
          <input type="file" id="localFileInput" accept="video/*" hidden />
        </label>
        <button type="button" class="cinema-mode-btn" id="useCinemaStreamBtn">🎬 Cinema Preview</button>
        <span class="player-status" id="playerStatus">Ready</span>
      </div>
    </div>
  </div>

  <!-- ADMIN VAULT DRAWER -->
  <aside class="admin-vault collapsed" id="adminVault">
    <h4>
      <span>🔒 Admin Vault</span>
      <span style="cursor:pointer;" id="closeVaultBtn">✕</span>
    </h4>
    <input type="password" id="adminPassInput" placeholder="Enter Password" />
    <button class="unlock-btn" id="unlockBtn">Unlock</button>
    <p id="vaultStatus" style="font-size:0.75rem; color:#9a9aa6; margin-top:8px;"></p>
  </aside>

  <div class="fullscreen-hint">Press <kbd>F</kbd> to toggle full screen</div>

  <script>
    const CATALOG = [
      { id: "inception", title: "INCEPTION", type: "movie", bg: "linear-gradient(135deg, #1b2838, #0b111a)", videoUrl: "" },
      { id: "interstellar", title: "INTERSTELLAR", type: "movie", bg: "linear-gradient(135deg, #2d231e, #120d0a)", videoUrl: "" },
      { id: "the-batman", title: "THE BATMAN", type: "movie", bg: "linear-gradient(135deg, #3b090e, #120406)", videoUrl: "" },
      { id: "avatar", title: "AVATAR", type: "movie", bg: "linear-gradient(135deg, #0d2b45, #05111c)", videoUrl: "" },
      { id: "joker", title: "JOKER", type: "series", bg: "linear-gradient(135deg, #283b12, #0e1407)", videoUrl: "" },
      { id: "spider-man", title: "SPIDER-MAN: NO WAY HOME", type: "movie", bg: "linear-gradient(135deg, #3d1228, #14060d)", videoUrl: "" }
    ];

    const myList = new Set(["inception"]);
    let currentFilter = "all";
    let activeTitle = "POKO FLIX";
    let currentBlobUrl = null;

    // Render Cards
    const carousel = document.getElementById("trendingCarousel");
    function renderCards() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      carousel.innerHTML = "";

      const filtered = CATALOG.filter((item) => {
        const matchesQuery = item.title.toLowerCase().includes(q);
        if (!matchesQuery) return false;
        if (currentFilter === "movie") return item.type === "movie";
        if (currentFilter === "series") return item.type === "series";
        if (currentFilter === "mylist") return myList.has(item.id);
        return true;
      });

      filtered.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.style.background = item.bg;
        const inList = myList.has(item.id);
        card.innerHTML = `
          <span class="card-badge">${item.type.toUpperCase()} • ${inList ? "✓ Saved" : "+ List"}</span>
          <span>▶ ${item.title}</span>
        `;
        card.addEventListener("click", () => openPlayer(item.title, item.videoUrl));
        carousel.appendChild(card);
      });
    }
    renderCards();

    // Player Elements
    const playerModal = document.getElementById("playerModal");
    const pokoVideo = document.getElementById("pokoVideo");
    const stageCanvas = document.getElementById("cinemaStageCanvas");
    const stageCtx = stageCanvas.getContext("2d");
    const cinemaControls = document.getElementById("cinemaControls");
    const cinemaPlayPauseBtn = document.getElementById("cinemaPlayPauseBtn");
    const cinemaSeekBar = document.getElementById("cinemaSeekBar");
    const cinemaTimeReadout = document.getElementById("cinemaTimeReadout");
    const playerTitle = document.getElementById("playerTitle");
    const playerStatus = document.getElementById("playerStatus");

    const TOTAL_DURATION = 120; // 2:00 preview timeline
    let cinemaPlaying = true;
    let cinemaElapsed = 0;
    let lastFrameTime = performance.now();
    let stageAnimId = null;

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const mins = String(Math.floor(s / 60)).padStart(2, "0");
      const rem = String(s % 60).padStart(2, "0");
      return `${mins}:${rem}`;
    }

    function drawCinemaFrame(now) {
      const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      if (cinemaPlaying) {
        cinemaElapsed = (cinemaElapsed + dt) % TOTAL_DURATION;
        cinemaSeekBar.value = cinemaElapsed.toFixed(1);
        cinemaTimeReadout.textContent = `${formatTime(cinemaElapsed)} / ${formatTime(TOTAL_DURATION)}`;
      }

      stageCtx.fillStyle = "#06060a";
      stageCtx.fillRect(0, 0, stageCanvas.width, stageCanvas.height);

      const pulse = Math.sin(cinemaElapsed * 2.4) * 55 + 250;
      const grad = stageCtx.createRadialGradient(640, 360, 20, 640, 360, pulse + 240);
      grad.addColorStop(0, "rgba(255, 42, 61, 0.58)");
      grad.addColorStop(0.5, "rgba(120, 25, 175, 0.25)");
      grad.addColorStop(1, "rgba(5, 5, 10, 0)");
      stageCtx.fillStyle = grad;
      stageCtx.fillRect(0, 0, stageCanvas.width, stageCanvas.height);

      const sweepX = ((cinemaElapsed * 380) % (stageCanvas.width + 420)) - 210;
      stageCtx.strokeStyle = "rgba(255, 70, 90, 0.75)";
      stageCtx.lineWidth = 3;
      stageCtx.beginPath();
      stageCtx.moveTo(sweepX, 110);
      stageCtx.lineTo(sweepX + 260, 610);
      stageCtx.stroke();

      stageCtx.fillStyle = "#ffffff";
      stageCtx.font = "900 58px sans-serif";
      stageCtx.textAlign = "center";
      stageCtx.fillText(activeTitle, 640, 345);

      stageCtx.fillStyle = "#ff4d5e";
      stageCtx.font = "700 20px sans-serif";
      stageCtx.fillText("POKO FLIX CINEMA PREVIEW • READY FOR MP4 STREAM", 640, 398);

      stageAnimId = requestAnimationFrame(drawCinemaFrame);
    }

    function startCinemaMode(title) {
      activeTitle = title;
      cinemaElapsed = 0;
      cinemaPlaying = true;
      cinemaPlayPauseBtn.textContent = "⏸ Pause";
      cinemaSeekBar.value = 0;
      cinemaTimeReadout.textContent = `00:00 / ${formatTime(TOTAL_DURATION)}`;

      pokoVideo.pause();
      pokoVideo.removeAttribute("src");
      pokoVideo.classList.add("hidden");
      stageCanvas.classList.remove("hidden");
      cinemaControls.classList.remove("hidden");

      lastFrameTime = performance.now();
      if (!stageAnimId) stageAnimId = requestAnimationFrame(drawCinemaFrame);
      playerStatus.textContent = "Playing cinema preview";
    }

    function openPlayer(title, url = "") {
      activeTitle = title;
      playerTitle.textContent = `Now Playing — ${title}`;
      playerModal.classList.add("open");
      playerModal.setAttribute("aria-hidden", "false");

      if (url) {
        if (stageAnimId) {
          cancelAnimationFrame(stageAnimId);
          stageAnimId = null;
        }
        stageCanvas.classList.add("hidden");
        cinemaControls.classList.add("hidden");
        pokoVideo.classList.remove("hidden");
        pokoVideo.src = url;
        pokoVideo.load();
        pokoVideo.play().then(() => {
          playerStatus.textContent = "Playing video";
        }).catch(() => {
          playerStatus.textContent = "Click ▶ on player to start";
        });
      } else {
        startCinemaMode(title);
      }
    }

    function closePlayer() {
      pokoVideo.pause();
      pokoVideo.removeAttribute("src");
      pokoVideo.load();
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
      if (stageAnimId) {
        cancelAnimationFrame(stageAnimId);
        stageAnimId = null;
      }
      playerModal.classList.remove("open");
      playerModal.setAttribute("aria-hidden", "true");
    }

    cinemaPlayPauseBtn.addEventListener("click", () => {
      cinemaPlaying = !cinemaPlaying;
      cinemaPlayPauseBtn.textContent = cinemaPlaying ? "⏸ Pause" : "▶ Play";
      lastFrameTime = performance.now();
    });

    cinemaSeekBar.addEventListener("input", (e) => {
      cinemaElapsed = Number(e.target.value);
      cinemaTimeReadout.textContent = `${formatTime(cinemaElapsed)} / ${formatTime(TOTAL_DURATION)}`;
      drawCinemaFrame(performance.now());
    });

    document.getElementById("cinemaFullscreenBtn").addEventListener("click", () => {
      const wrap = document.getElementById("videoWrap");
      if (!document.fullscreenElement) wrap.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    pokoVideo.addEventListener("error", () => {
      if (!pokoVideo.src) return;
      playerStatus.textContent = "Video URL failed — switched to Cinema Preview";
      startCinemaMode(activeTitle);
    });

    document.getElementById("playNowBtn").addEventListener("click", () => {
      openPlayer(CATALOG[0].title, CATALOG[0].videoUrl);
    });

    document.getElementById("heroMyListBtn").addEventListener("click", () => {
      const first = CATALOG[0];
      if (myList.has(first.id)) myList.delete(first.id);
      else myList.add(first.id);
      renderCards();
    });

    document.getElementById("closePlayerBtn").addEventListener("click", closePlayer);
    playerModal.addEventListener("click", (e) => {
      if (e.target === playerModal) closePlayer();
    });

    document.getElementById("customUrlForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const customUrl = document.getElementById("customUrlInput").value.trim();
      if (!customUrl) return;
      openPlayer("Custom Stream", customUrl);
    });

    document.getElementById("localFileInput").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = URL.createObjectURL(file);
      openPlayer(file.name, currentBlobUrl);
    });

    document.getElementById("useCinemaStreamBtn").addEventListener("click", () => {
      startCinemaMode(activeTitle);
    });

    // Sidebar filter tabs
    document.querySelectorAll("#sidebarNav .nav-item[data-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#sidebarNav .nav-item").forEach((el) => el.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        const labels = { all: "Trending Now >", movie: "Movies >", series: "Series >", mylist: "My List >" };
        document.getElementById("sectionHeading").textContent = labels[currentFilter];
        renderCards();
      });
    });

    // Intro Overlay
    const introOverlay = document.getElementById("intro-overlay");
    const skipIntroBtn = document.getElementById("skipIntroBtn");
    const replayIntroBtn = document.getElementById("replayIntroBtn");

    function dismissIntro() {
      introOverlay.classList.add("hidden");
    }

    let introTimer = setTimeout(dismissIntro, 2600);
    skipIntroBtn.addEventListener("click", () => {
      clearTimeout(introTimer);
      dismissIntro();
    });

    replayIntroBtn.addEventListener("click", () => {
      introOverlay.classList.remove("hidden");
      clearTimeout(introTimer);
      introTimer = setTimeout(dismissIntro, 2600);
    });

    // Admin Vault
    const adminVault = document.getElementById("adminVault");
    const toggleVault = () => adminVault.classList.toggle("collapsed");
    document.getElementById("topAdminBtn").addEventListener("click", toggleVault);
    document.getElementById("sidebarAdminBtn").addEventListener("click", toggleVault);
    document.getElementById("closeVaultBtn").addEventListener("click", toggleVault);
    document.getElementById("unlockBtn").addEventListener("click", () => {
      const val = document.getElementById("adminPassInput").value;
      const status = document.getElementById("vaultStatus");
      status.textContent = val ? "Vault unlocked (connect backend auth)." : "Enter a password.";
      status.style.color = val ? "#ff5c6c" : "#f5b041";
    });

    // Carousel scroll & search
    document.getElementById("scrollLeft").addEventListener("click", () => {
      carousel.scrollBy({ left: -400, behavior: "smooth" });
    });
    document.getElementById("scrollRight").addEventListener("click", () => {
      carousel.scrollBy({ left: 400, behavior: "smooth" });
    });
    document.getElementById("searchInput").addEventListener("input", renderCards);

    // Fullscreen & Escape
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && playerModal.classList.contains("open")) {
        closePlayer();
      } else if (e.key.toLowerCase() === "f" && document.activeElement.tagName !== "INPUT") {
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
